name: Deploy next to Cloudflare Pages

# 新機能の試験公開。next ブランチへの push で Cloudflare Pages へ出す。
# 本番（main → GitHub Pages）は pages.yml が担当し、このワークフローは触らない。
on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-next
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: kobun-vocab-learning-next

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
            exit 1
          fi
      - name: Generate runtime config
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Check data and SRS
        # 検査一覧は scripts/check-all.mjs が正本。
        run: node scripts/check-all.mjs
      - name: Prepare static files
        # pages.yml と同じ配信物。片方だけ直すと本番と試験版で中身がずれる。
        run: |
          mkdir -p _site/static _site/static/vendor/fsrs _site/data
          cp index.html _site/
          cp static/*.js static/*.css static/*.svg static/config.json _site/static/
          # cp static/*.js のグロブはサブディレクトリを拾わない。
          cp static/vendor/fsrs/index.umd.js static/vendor/fsrs/LICENSE _site/static/vendor/fsrs/
          cp data/*.json _site/data/
      - name: Ensure Cloudflare Pages project
        # 初回だけ作成する。既にあれば失敗するので無視する。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch next || true
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name "$CF_PAGES_PROJECT" --branch next --commit-dirty=true
