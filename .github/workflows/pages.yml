name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate runtime config
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Check data and SRS
        # 検査一覧は scripts/check-all.mjs が正本。手元でも同じコマンドを実行する。
        run: node scripts/check-all.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site/static _site/static/vendor/fsrs _site/data
          cp index.html .nojekyll _site/
          cp static/*.js static/*.css static/*.svg static/config.json _site/static/
          # cp static/*.js のグロブはサブディレクトリを拾わない。消すと本番だけ404になる。
          cp static/vendor/fsrs/index.umd.js static/vendor/fsrs/LICENSE _site/static/vendor/fsrs/
          cp data/*.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
