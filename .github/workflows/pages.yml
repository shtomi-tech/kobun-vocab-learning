name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate runtime config
        run: node scripts/write-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Check data and SRS
        run: |
          node --check static/mode-vocab.js
          node scripts/check-data.mjs
          node scripts/check-waka-phase1.mjs
          node scripts/check-waka-display.mjs
          node scripts/check-srs.cjs
          node scripts/check-set-06.mjs
          node scripts/check-set-07.mjs
          node scripts/check-set-08.mjs
          node scripts/check-set-09.mjs
          node scripts/check-set-10.mjs
          node scripts/check-set-11.mjs
          node scripts/check-vocab-goal-ui.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site/static _site/data
          cp index.html .nojekyll _site/
          cp static/*.js static/*.css static/*.svg static/config.json _site/static/
          cp data/*.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
